<svg width="240" height="60" viewBox="0 0 240 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoBgGrad" x1="0" y1="0" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>
    <linearGradient id="logoGold" x1="14" y1="6" x2="38" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="logoCyan" x1="18" y1="13" x2="34" y2="13" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="logoWhite" x1="26" y1="20" x2="26" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <!-- Mark Container -->
  <g transform="translate(4, 4)">
    <rect width="52" height="52" rx="14" fill="url(#logoBgGrad)"/>
    <rect x="0.5" y="0.5" width="51" height="51" rx="13.5" stroke="#334155" stroke-opacity="0.8"/>

    <!-- Radio waves -->
    <path d="M15 14C18.2 10.2 22 8.5 26 8.5C30 8.5 33.8 10.2 37 14" stroke="url(#logoGold)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M19 18C21.1 15.5 23.5 14.5 26 14.5C28.5 14.5 30.9 15.5 33 18" stroke="url(#logoCyan)" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Colonnade wings -->
    <path d="M10 43V31L17 27V43H10Z" fill="#2563EB" fill-opacity="0.85"/>
    <path d="M42 43V31L35 27V43H42Z" fill="#2563EB" fill-opacity="0.85"/>

    <!-- Central archway -->
    <path d="M26 20.5L17 27V44H21.5V36C21.5 33.5 23.5 31.5 26 31.5C28.5 31.5 30.5 33.5 30.5 36V44H35V27L26 20.5Z" fill="url(#logoWhite)"/>
    <path d="M21.5 44V36C21.5 33.5 23.5 31.5 26 31.5C28.5 31.5 30.5 33.5 30.5 36V44H21.5Z" fill="#0B0F19"/>
    <circle cx="26" cy="27.5" r="1.2" fill="#38BDF8"/>
  </g>

  <!-- Typography -->
  <text x="68" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="currentColor" letter-spacing="-0.02em">Campus<tspan fill="#38BDF8">OS</tspan></text>
  <text x="68" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8" letter-spacing="0.04em">OPERATIONS SYSTEM</text>
</svg>
