services:
  # ============================================================================
  # Database Service (PostgreSQL)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: campus-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campus_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campus_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-campus_os}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campus_admin} -d ${POSTGRES_DB:-campus_os}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # API Server Backend (Express 5 + Drizzle)
  # ============================================================================
  api-server:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: campus-os-api
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-campus_admin}:${POSTGRES_PASSWORD:-campus_secret_password}@postgres:5432/${POSTGRES_DB:-campus_os}
    ports:
      - "${API_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================================================
  # Web Frontend (Vite + Nginx Reverse Proxy)
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: campus-os-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api-server

volumes:
  postgres_data:
    driver: local
